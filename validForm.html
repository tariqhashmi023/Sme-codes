<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="valid.css">
</head>
<body>
    <h1>Lamrin Tech Skills Univesity</h1>
     <form name="signupForm" onsubmit="return validation()" method="post">
        <h2>Student Registaion</h2>
    <label>Username</label>     
    <br>
    <input type="text" id="name" oninput=modify() placeholder="Enter Your Name" name="sname">
    <br><br>
    <label>Roll No</label>
    <br>
    <input type="number" placeholder="Enter Your Roll No." name="sroll" min="10" max="20">
    <br><br>
    <label>Email</label> 
    <br>  
    <input type="email" placeholder="Enter Your Email" name="semail" required>
    <br><br>
    <label>Password</label>
    <br>   
    <input type="password" placeholder="Enter Your Password" name="spass" required>
    <br><br>
    <label>Gender</label>
    <br>
    <input type="radio" name="gender">Male
    <input type="radio" name="gender">Female
    <input type="radio" name="gender">Other
    <br><br>
    <input type ="submit" value="Submit">
    </form>
    
<script src="valid.js"></script>
  
</body>
</html>
