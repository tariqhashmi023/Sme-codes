<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo">Good Morning</p>

    <script>
        let op ="*"
        let x = 10 , y = 5;

        switch(op){
            case "+":
                document.getElementById("demo").innerHTML=x+y;
            break; 
            
             case "-":
                document.getElementById("demo").innerHTML=x-y;
            break; 

             case "*":
                document.getElementById("demo").innerHTML=x*y;
            break; 

             case "/":
                document.getElementById("demo").innerHTML=x/y;
            break; 
        }
    </script>
</body>
</html>
