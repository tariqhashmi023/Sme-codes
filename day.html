<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo">Good Morning</p>
    <script>
        let x = 1;
       switch (x) {
            case 0:
                document.getElementById("demo").innerHTML= "Monday";
                break;
            case 1:
                document.getElementById("demo").innerHTML= "Tuesday";
                break;
            case 2:
                document.getElementById("demo").innerHTML= "Sunday";
                break;    
            default:
                document.getElementById("demo").innerHTML= "not found";
                break;
        }
    </script>
</body>
</html>
