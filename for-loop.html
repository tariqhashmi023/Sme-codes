<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Foor Loop</h1>
    <p id="demo"></p>

    <script>
        let text ="";
        for(let i = 0; i<=50; i++){
            text += i+ "<br>";
        }
        document.getElementById("demo").innerHTML=text;

    </script>
</body>
</html>
