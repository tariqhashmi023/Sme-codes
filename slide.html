<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#flip").click (function(){
                $("#panel").slideToggle("slow");
            });
        });
    </script>
    <style>
        #panel,#flip{
            padding: 5px;
            text-align: center;
            background-color: #9aaf60;
            border: solid 3px #0f0e0e;
            
        }
        #flip{
            margin: 1px 250px 0px 250px;
        }
        #panel{
            padding: 50px;
            display: none;
            margin: 20px 250px 300px 250px;
        }
    </style>
</head>
<body>
    <div id="flip">Click me to see the message</div>
    <div id="panel">Hello!!!!!!!</div>
</body>
</html>
